<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotSense Parking Assistant</title>
<link rel="preload" href="data/index.json" as="fetch" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3EF;--panel:#FFFFFF;--ink:#14213D;--mute:#5B6478;--line:#D9DCD3;--sign:#0B3C8C;--ok:#1E9E5A;--mid:#E8A317;--bad:#D6453D;--bubble:#E7EBF3}
@media(prefers-color-scheme:dark){:root{--bg:#0E1424;--panel:#172036;--ink:#E8ECF5;--mute:#98A2B8;--line:#2A3552;--sign:#6C9BFF;--bubble:#222D49}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Archivo,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.sign{width:38px;height:38px;border-radius:8px;background:#0B3C8C;color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 2px #0B3C8C}
h1{font-size:20px;margin:0;font-weight:800;font-stretch:80%}
header p{margin:0;font-size:13px;color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:1.3fr 1fr;min-height:0}
#map{min-height:300px}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.m.bot{background:var(--bubble);border-bottom-left-radius:3px}
.m.me{align-self:flex-end;background:var(--sign);color:#fff;border-bottom-right-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips button{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--sign)}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
input{flex:1;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
form button{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:8px;background:var(--sign);color:#fff;cursor:pointer}
:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.legend{position:absolute;z-index:500;right:10px;bottom:22px;background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.note{font-size:11.5px;color:var(--mute);padding:0 14px 10px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="sign" aria-hidden="true">P</div>
  <div><h1>SpotSense</h1><p>Street-parking assistant for central Riga. Real street map, simulated parking data.</p></div>
</header>
<main>
  <div id="map" style="position:relative" aria-label="Map of street segments coloured by free spots"></div>
  <aside>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><input id="q" autocomplete="off" placeholder="Ask about a block, e.g. Ģertrūdes iela between Barona and Čaka" aria-label="Message"><button>Send</button></form>
    <div class="note">Demo only: streets come from OpenStreetMap; availability, cameras and reports are simulated. No photos, plates or faces are stored.</div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Config ----------
const PRIOR=[.35,.3,.3,.3,.3,.35,.45,.6,.75,.85,.88,.9,.9,.88,.88,.88,.9,.92,.9,.8,.7,.6,.5,.4];
const now=()=>Date.now();
const norm=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const stem=n=>norm(n).replace(/ (iela|bulvaris|dambis|laukums|krastmala|prospekts|gatve|aleja|soseja|cels)$/,"");
const hs=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
const dist=(a,b)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const q=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const mid=s=>s.pts[Math.floor(s.pts.length/2)];
const rep={tr:{}};let userRep=.6;try{userRep=+localStorage.getItem("ss_rep")||.6}catch(e){}
let SEG=[],NAMES=[],ready=false;
const lab=s=>`${s.st}${s.zone?" (zone "+s.zone+")":""} between ${s.a.join(" / ")||"the start of the street"} and ${s.b.join(" / ")||"the end of the street"}`;

// ---------- Fusion: prior + camera + decayed, trust-weighted reports ----------
function estimate(s,hour){
  const h=hour??new Date().getHours(),fresh=(rep.tr[s.id]||[]).map(r=>({...r,d:Math.exp(-(now()-r.t)/(20*6e4))})).filter(r=>r.d>.05);
  let occ=PRIOR[h];
  const adj=fresh.reduce((a,r)=>a+r.w*r.d*(r.s==="free"?-.15:.15),0);
  const repOcc=Math.min(.98,Math.max(.02,occ+adj));
  const live=hour===undefined||hour===new Date().getHours();
  if(live&&s.cam)occ=.7*(1-s.camFree/s.cap)+.3*repOcc;else if(live)occ=repOcc;
  const free=Math.round(s.cap*(1-occ));
  const conf=!live?"low (typical pattern, not live)":s.cam&&fresh.length?"high":s.cam||fresh.length>=2?"medium":"low";
  return{free,conf,n:fresh.length,occ};
}
const hexcol=s=>{const r=estimate(s).free/s.cap;return r>.3?"#1E9E5A":r>.1?"#E8A317":"#D6453D"};

// ---------- Trust engine for user reports ----------
function trust(s,status,pos){
  const g=pos?(()=>{const d=dist(pos,mid(s));return d<=150?1:d<=350?.6:.1})():.4;
  const c=s.cam?((status==="free")===(s.camFree/s.cap>.15)?1:.3):.5;
  const o=(rep.tr[s.id]||[]).filter(r=>now()-r.t<30*6e4),cons=o.length?o.filter(r=>r.s===status).length/o.length:.5;
  const score=.35*g+.25*c+.15*cons+.25*userRep;
  return{g,c,cons,score,ok:score>=.55};
}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),()=>res(null),{timeout:2500,maximumAge:60000})})}

// ---------- Street data from OpenStreetMap (Overpass), split into blocks at intersections ----------
const BUILD=/[?&]build=1/.test(location.search);
async function fetchT(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(u,{signal:c.signal})}finally{clearTimeout(t)}}
async function fetchWays(BB,ms){
  const q=`[out:json][timeout:90];way["highway"]["name"]["highway"~"^(primary|secondary|tertiary|residential|unclassified|living_street|primary_link|secondary_link|tertiary_link)$"](${BB});out geom;`;
  for(const u of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const r=await fetchT(u+"?data="+encodeURIComponent(q),ms);if(r.ok)return(await r.json()).elements}catch(e){}}
  throw new Error("Overpass unavailable");
}
const thin=p=>{const o=[p[0]];for(let i=1;i<p.length-1;i++)if(dist(o[o.length-1],p[i])>=6)o.push(p[i]);o.push(p[p.length-1]);return o};
function buildBlocks(ways){ // raw blocks, compact enough to save as streets.json
  const ns=new Map(),seen=new Set(),out=[];
  ways.forEach(w=>w.nodes.forEach(n=>{let s=ns.get(n);if(!s)ns.set(n,s=new Set());s.add(w.tags.name)}));
  const others=(n,name)=>[...ns.get(n)].filter(x=>x!==name);
  ways.forEach(w=>{const name=w.tags.name;let st=0;
    for(let i=1;i<w.nodes.length;i++){
      if(i!==w.nodes.length-1&&ns.get(w.nodes[i]).size<2)continue;
      const pts=w.geometry.slice(st,i+1).map(p=>[+p.lat.toFixed(5),+p.lon.toFixed(5)]),a=others(w.nodes[st],name),b=others(w.nodes[i],name);
      let len=0;for(let k=1;k<pts.length;k++)len+=dist(pts[k-1],pts[k]);
      const key=name+"|"+[...a].sort()+"|"+[...b].sort();
      if(len>=30&&(a.length||b.length)&&!seen.has(key)){seen.add(key);out.push({id:"w"+w.id+"_"+st,st:name,a,b,pts:thin(pts),len:Math.round(len)})}
      st=i;
    }});
  return out;
}
function hydrate(r){
  const x=hs(r.id),cap=Math.max(4,Math.round(r.len/6)),cam=x%7===0;
  if(x%5===0)rep.tr[r.id]=[{s:(x>>5)%2?"free":"occupied",t:now()-((x>>7)%15+1)*6e4,w:.65}];
  return{...r,stem:stem(r.st),as:r.a.map(stem),bs:r.b.map(stem),cap,cam,camFree:cam?Math.round(cap*((x>>3)%60)/100):0};
}
const T0=[56.86,23.92],TS=[.03,.06],NR=8,NC=8;
const tid=(la,lo)=>Math.floor((la-T0[0])/TS[0])+"_"+Math.floor((lo-T0[1])/TS[1]);
const tbb=id=>{const[r,c]=id.split("_").map(Number);return[T0[0]+r*TS[0],T0[1]+c*TS[1],T0[0]+(r+1)*TS[0],T0[1]+(c+1)*TS[1]]};
let INDEX=null,tileSet=new Set();const loaded=new Map();
function loadTile(id){
  if(loaded.has(id))return loaded.get(id);
  const p=(async()=>{try{const r=await fetchT(`data/t_${id}.json`,8000);if(!r.ok)return;const segs=(await r.json()).map(hydrate);SEG.push(...segs);drawSegs(segs)}catch(e){}})();
  loaded.set(id,p);return p;
}
const ensureStreet=k=>Promise.all(((INDEX.names[k]||{}).t||[]).map(loadTile));
async function loadView(){
  if(!INDEX)return;
  if(map.getZoom()<14){hint.style.display="block";return}
  hint.style.display="none";
  const b=map.getBounds(),r0=Math.floor((b.getSouth()-T0[0])/TS[0]),r1=Math.floor((b.getNorth()-T0[0])/TS[0]),c0=Math.floor((b.getWest()-T0[1])/TS[1]),c1=Math.floor((b.getEast()-T0[1])/TS[1]),ids=[];
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(tileSet.has(r+"_"+c))ids.push(r+"_"+c);
  await Promise.all(ids.map(loadTile));
}
function crc32(u){const t=crc32.t||(crc32.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let x=-1;for(const b of u)x=t[(x^b)&255]^(x>>>8);return(x^-1)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const w=(a,v,n)=>{for(let i=0;i<n;i++)a.push((v>>>(8*i))&255)};
  for(const[name,txt]of Object.entries(files)){
    const nb=enc.encode(name),d=enc.encode(txt),crc=crc32(d),h=[],e=[];
    w(h,0x04034b50,4);w(h,20,2);w(h,0,2);w(h,0,2);w(h,0,2);w(h,0,2);w(h,crc,4);w(h,d.length,4);w(h,d.length,4);w(h,nb.length,2);w(h,0,2);
    w(e,0x02014b50,4);w(e,20,2);w(e,20,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,crc,4);w(e,d.length,4);w(e,d.length,4);w(e,nb.length,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,0,4);w(e,off,4);
    parts.push(new Uint8Array(h),nb,d);cd.push(new Uint8Array(e),nb);off+=h.length+nb.length+d.length;
  }
  const cs=cd.reduce((s,x)=>s+x.length,0),n=Object.keys(files).length,end=[];
  w(end,0x06054b50,4);w(end,0,2);w(end,0,2);w(end,n,2);w(end,n,2);w(end,cs,4);w(end,off,4);w(end,0,2);
  return new Blob([...parts,...cd,new Uint8Array(end)],{type:"application/zip"});
}
async function build(){ // one-time: download all Riga tiles from OpenStreetMap and package them as data.zip
  const files={},names={},tiles=[],failed=[];let total=0;
  for(let r=0;r<NR;r++)for(let c=0;c<NC;c++){
    const id=r+"_"+c,b=tbb(id);
    status.textContent=`Build mode: tile ${r*NC+c+1} of ${NR*NC} (${total} blocks so far). Keep this tab open and visible.`;
    let ways=null;
    for(let k=0;k<3&&!ways;k++){try{ways=await fetchWays([b[0]-.003,b[1]-.005,b[2]+.003,b[3]+.005].join(","),60000)}catch(e){await new Promise(z=>setTimeout(z,4000))}}
    if(!ways){failed.push(id);continue}
    const segs=buildBlocks(ways).filter(s=>{const m=s.pts[Math.floor(s.pts.length/2)];return tid(m[0],m[1])===id});
    if(segs.length){
      files[`data/t_${id}.json`]=JSON.stringify(segs);tiles.push(id);total+=segs.length;
      segs.forEach(s=>{const k=stem(s.st),e=names[k]||(names[k]={n:s.st,t:[]});if(!e.t.includes(id))e.t.push(id)});
    }
    await new Promise(z=>setTimeout(z,1500));
  }
  files["data/index.json"]=JSON.stringify({tiles,names});
  status.textContent=`Build finished: ${total} blocks, ${Object.keys(names).length} streets, ${tiles.length} tiles.${failed.length?" Failed tiles: "+failed.join(", ")+". Reload with ?build=1 to retry.":""} Click “Download data.zip”, unzip it and upload the data folder to your repository.`;
  const bt=document.createElement("button");bt.type="button";bt.textContent="Download data.zip";
  bt.onclick=()=>{const k=document.createElement("a");k.href=URL.createObjectURL(zip(files));k.download="data.zip";k.click()};
  document.getElementById("chips").appendChild(bt);
}
// ---------- Map ----------
const map=L.map("map",{preferCanvas:true}).setView([56.9535,24.1190],15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);
const lines={};
function paint(s){lines[s.id].setStyle({color:hexcol(s)})}
function drawSegs(segs){segs.forEach(s=>{if(lines[s.id])return;lines[s.id]=L.polyline(s.pts,{weight:5,opacity:.85}).addTo(map).on("click",()=>say(`Is there parking space available on ${lab(s)}?`)).on("mouseover",function(){const e=estimate(s);this.unbindTooltip().bindTooltip(`${lab(s)}: ~${e.free}/${s.cap} free`,{sticky:true}).openTooltip()});paint(s)})}
const hint=document.createElement("div");hint.className="legend";hint.style.cssText="right:auto;left:50px;top:10px;bottom:auto;display:none";hint.textContent="Zoom in to see street blocks";document.getElementById("map").appendChild(hint);
map.on("moveend",loadView);
const lg=L.control({position:"bottomright"});lg.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML='<i style="background:#1E9E5A"></i>Many free<br><i style="background:#E8A317"></i>Few free<br><i style="background:#D6453D"></i>Almost full';return d};lg.addTo(map);

// ---------- Assistant (tools: get_availability, predict, submit_report) ----------
const log=document.getElementById("log");
function add(t,who){const d=document.createElement("div");d.className="m "+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const fmt=(s,e)=>`${lab(s)}: about ${e.free} of ${s.cap} bays free (simulated). Source: ${s.cam?"camera + ":""}${e.n} recent report${e.n===1?"":"s"}. Confidence: ${e.conf}.`;
function findIn(text){
  let t=text;const hits=[];
  NAMES.forEach(n=>{const i=t.indexOf(n.key);if(i>=0){hits.push({stem:n.stem,i});t=t.slice(0,i)+" ".repeat(n.key.length)+t.slice(i+n.key.length)}});
  return hits.sort((p,q)=>p.i-q.i);
}
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const clean=p=>p.replace(/[?.!,]/g," ").replace(/\b(street|iela|str|st|ave|avenue|bulvaris|blvd|road|rd|the)\b/g," ").split(/\s+/).filter(Boolean);
function fz(p){ // tolerate typos such as "terbates" for "Tērbatas"
  const w=clean(p);let best=null;
  for(let i=0;i<w.length;i++)for(let n=1;n<=3&&i+n<=w.length;n++){
    const c=w.slice(i,i+n).join(" ");if(c.length<4)continue;
    for(const k of NAMES){if(k.key[0]!==c[0]||Math.abs(k.key.length-c.length)>2)continue;const d=lev(c,k.key);if(d<=(c.length<8?1:2)&&(!best||d<best.d))best={stem:k.stem,d}}}
  return best;
}
function parse(t){
  const m=t.match(/(?:between|from)\s+(.+?)\s+(?:and|to)\s+(.+)/),bad=[];
  const pre=m?t.slice(0,m.index):t;
  const main=((findIn(pre)[0]||fz(pre)||findIn(t)[0])||{}).stem;
  const cross=m?[m[1],m[2]].map(p=>{const f=findIn(p)[0]||fz(p);if(!f)bad.push(clean(p).join(" "));return(f||{}).stem}).filter(Boolean):[];
  return{main,cross,bad};
}
function findSeg(main,c){
  if(!main||c.length!==2||c[0]===c[1])return null;
  return SEG.filter(s=>s.stem===main&&((s.as.includes(c[0])&&s.bs.includes(c[1]))||(s.as.includes(c[1])&&s.bs.includes(c[0])))).sort((p,q)=>q.len-p.len)[0]||null;
}
function blockList(main){
  const l=[...new Set(SEG.filter(s=>s.stem===main).map(s=>"• between "+(s.a.join(" / ")||"the start")+" and "+(s.b.join(" / ")||"the end")))];
  return l.slice(0,14).join("\n")+(l.length>14?"\n…and "+(l.length-14)+" more":"");
}
const DNm=k=>(INDEX.names[k]||{}).n||k;
const sum=(l,h)=>l.reduce((o,s)=>(o.f+=estimate(s,h).free,o.c+=s.cap,o),{f:0,c:0});
async function findSpan(main,c){ // "between X and Y": locate where X and Y cross the street by geometry, then take the blocks in between
  if(!main||c.length!==2||c[0]===c[1])return null;
  await Promise.all(c.map(ensureStreet));
  const bl=SEG.filter(s=>s.stem===main),P=[[],[]];
  c.forEach((k,i)=>{
    const cp=SEG.filter(s=>s.stem===k).flatMap(s=>s.pts);
    bl.forEach(s=>s.pts.forEach(p=>{if(cp.some(q=>Math.abs(q[0]-p[0])<4e-4&&Math.abs(q[1]-p[1])<7e-4&&dist(p,q)<=30))P[i].push(p)}));
  });
  let best=null;
  P[0].forEach(p=>P[1].forEach(q=>{const d=dist(p,q);if(d>20&&(!best||d<best.d))best={p,q,d}}));
  if(!best)return null;
  const k=Math.cos(best.p[0]*Math.PI/180),vx=(best.q[1]-best.p[1])*k,vy=best.q[0]-best.p[0],L2=vx*vx+vy*vy;
  const blocks=bl.filter(s=>{const m=mid(s),x=(m[1]-best.p[1])*k,y=m[0]-best.p[0],t=(x*vx+y*vy)/L2,pd=Math.abs(x*vy-y*vx)/Math.sqrt(L2)*111000;return t>-.05&&t<1.05&&pd<90});
  return blocks.length?{blocks}:null;
}
async function reply(raw){
  if(!ready)return"The street data is still loading. Please try again in a few seconds.";
  const t=norm(raw),{main,cross,bad}=parse(t);
  if(main)await ensureStreet(main);
  const seg=findSeg(main,cross),span=seg?null:await findSpan(main,cross),tg=seg?[seg]:span?span.blocks:null;
  const nm=main?DNm(main):"",all=main?SEG.filter(s=>s.stem===main):[];
  const where=seg?lab(seg):span?`${nm} between ${DNm(cross[0])} and ${DNm(cross[1])}`:"";
  const st=/free|empty|available/.test(t)?"free":/occupied|full|taken/.test(t)?"occupied":null;
  let need=null;
  if(main&&!tg){const x=sum(all);need=(bad.length?`I didn’t recognise “${bad.join("” or “")}” as a street in Riga. Please check the spelling. `:"")+(cross.length===2?`I couldn’t match that exact stretch of ${nm}. `:`Which block of ${nm}? Please say “between … and …”. `)+(all.length?`Overall, about ${x.f} of ${x.c} bays are free across its ${all.length} blocks (simulated). Blocks I know:\n${blockList(main)}`:"I couldn’t load its blocks.")}
  if(/report/.test(t)){
    if(!tg)return need||"Which block is it on? For example: “Report free on Terbatas iela between Elizabetes iela and Ģertrūdes iela”.";
    if(!seg)return`That stretch has ${tg.length} blocks. Please report on one block:\n`+tg.slice(0,8).map(s=>"• "+lab(s)).join("\n");
    if(!st)return"Is the spot free or occupied?";
    const pos=await getPos(),r=trust(seg,st,pos);
    let m=`Trust check for your report (${st}) on ${lab(seg)}:\nLocation match: ${pos?r.g.toFixed(2):"0.40 (location unavailable, demo mode)"}\nCamera agreement: ${r.c.toFixed(2)}${seg.cam?"":" (no camera here)"}\nConsensus: ${r.cons.toFixed(2)}\nYour reputation: ${userRep.toFixed(2)}\nScore: ${r.score.toFixed(2)} (needs 0.55)\n`;
    if(r.ok){(rep.tr[seg.id]=rep.tr[seg.id]||[]).push({s:st,t:now(),w:r.score});userRep=Math.min(1,userRep+.03);m+="Report accepted. The map is updated."}
    else{userRep=Math.max(.1,userRep-.05);m+="Report rejected. It did not pass the trust check, so the map is unchanged."}
    try{localStorage.setItem("ss_rep",userRep)}catch(e){}
    paint(seg);return m;
  }
  const tm=t.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(tm){let h=+tm[1];if(tm[3]==="pm"&&h<12)h+=12;if(tm[3]==="am"&&h===12)h=0;h%=24;
    if(!tg)return need||"Which block? Please name a street and say “between … and …”.";
    const x=sum(tg,h);return`Typical availability around ${String(h).padStart(2,"0")}:00 (pattern estimate, not live):\n${where}: about ${x.f} of ${x.c} bays free`}
  if(tg){
    if(seg){map.setView(mid(seg),17);return fmt(seg,estimate(seg))}
    const x=sum(tg);map.fitBounds(L.latLngBounds(tg.flatMap(s=>s.pts)));
    return`${where}: about ${x.f} of ${x.c} bays free across ${tg.length} blocks (simulated). Confidence: ${tg.some(s=>s.cam)?"medium":"low"}.`}
  if(need)return need;
  if(/where|near|best|find|park|spot|free|space/.test(t)){
    const b=map.getBounds(),big=SEG.filter(s=>s.cap>=8),pool=big.filter(s=>b.contains(mid(s)));
    const top=(pool.length?pool:big).sort((a,c)=>estimate(c).free/c.cap-estimate(a).free/a.cap).slice(0,3);
    return"Best options in the area on the map right now:\n"+top.map(x=>fmt(x,estimate(x))).join("\n\n")}
  return"Ask about a specific block, for example: “Is there parking space available on Ģertrūdes iela between Krišjāņa Barona iela and Aleksandra Čaka iela?”";
}
async function say(text){add(text,"me");let a;try{a=await reply(text)}catch(e){a="Sorry, something went wrong while answering: "+e.message}add(a,"bot")}
document.getElementById("f").onsubmit=e=>{e.preventDefault();const i=document.getElementById("q");if(i.value.trim()){say(i.value.trim());i.value=""}};
function chip(x){const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>say(x);document.getElementById("chips").appendChild(b)}
const status=add("Hi, I’m the SpotSense assistant. Loading the street index…","bot");
(async()=>{
  try{
    if(BUILD){await build();return}
    const r=await fetchT("data/index.json",8000);if(!r.ok)throw new Error("index missing");
    INDEX=await r.json();tileSet=new Set(INDEX.tiles);
    const stems=Object.keys(INDEX.names),lw={};
    NAMES=stems.map(s=>({key:s,stem:s}));
    stems.forEach(s=>{const w=s.split(" ").pop();lw[w]=(lw[w]||0)+1});
    stems.forEach(s=>{const w=s.split(" ").pop();if(s.includes(" ")&&w.length>=4&&lw[w]===1&&!INDEX.names[w])NAMES.push({key:w,stem:s})});
    NAMES.sort((p,q)=>q.key.length-p.key.length);
    ready=true;
    await loadView();
    status.textContent=`Ready. I know ${stems.length} streets across Riga. Ask about a specific block, for example “Ģertrūdes iela between Krišjāņa Barona iela and Aleksandra Čaka iela”, or report a free or occupied bay. Streets are real (OpenStreetMap); parking data is simulated. Zoom in on the map to see street blocks.`;
    const good=SEG.filter(s=>s.a.length&&s.b.length&&s.len>80),pick=[];
    while(pick.length<3&&good.length)pick.push(good.splice(Math.floor(Math.random()*good.length),1)[0]);
    pick.forEach(s=>chip(`Is there parking space available on ${lab(s)}?`));
    chip("Where can I park right now?");
  }catch(e){status.textContent="I couldn’t find the street data (data/index.json). Open this page once with ?build=1 at the end of the link to create it, then upload the data folder to your repository."}
})();
</script>
