<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotSense Parking Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3EF;--panel:#FFFFFF;--ink:#14213D;--mute:#5B6478;--line:#D9DCD3;--sign:#0B3C8C;--ok:#1E9E5A;--mid:#E8A317;--bad:#D6453D;--bubble:#E7EBF3}
@media(prefers-color-scheme:dark){:root{--bg:#0E1424;--panel:#172036;--ink:#E8ECF5;--mute:#98A2B8;--line:#2A3552;--sign:#6C9BFF;--bubble:#222D49}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Archivo,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.sign{width:38px;height:38px;border-radius:8px;background:#0B3C8C;color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 2px #0B3C8C}
h1{font-size:20px;margin:0;font-weight:800;font-stretch:80%}
header p{margin:0;font-size:13px;color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:1.3fr 1fr;min-height:0}
#map{min-height:300px}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.m.bot{background:var(--bubble);border-bottom-left-radius:3px}
.m.me{align-self:flex-end;background:var(--sign);color:#fff;border-bottom-right-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips button{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--sign)}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
input{flex:1;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
form button{font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:8px;background:var(--sign);color:#fff;cursor:pointer}
:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.legend{position:absolute;z-index:500;right:10px;bottom:22px;background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.note{font-size:11.5px;color:var(--mute);padding:0 14px 10px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:42vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="sign" aria-hidden="true">P</div>
  <div><h1>SpotSense</h1><p>Street-parking assistant for Riga. Demo on simulated data.</p></div>
</header>
<main>
  <div id="map" style="position:relative" aria-label="Map of street segments coloured by free spots"></div>
  <aside>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><input id="q" autocomplete="off" placeholder="Ask about a block, e.g. Ģertrūdes iela between Barona and Čaka" aria-label="Message"><button>Send</button></form>
    <div class="note">Demo only: availability, cameras and reports are simulated. No photos, plates or faces are stored.</div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Simulated data (coordinates approximate) ----------
const DN={gertrudes:"Ģertrūdes iela",terbatas:"Terbatas iela",baron:"Krišjāņa Barona iela",caka:"Aleksandra Čaka iela",brivibas:"Brīvības iela",elizabetes:"Elizabetes iela",dzirnavu:"Dzirnavu iela"};
const K={gertrudes:"gertrud",terbatas:"terbat",baron:"baron",caka:"caka",brivibas:"brivib",elizabetes:"elizabet",dzirnavu:"dzirnav"};
const SEG=[
 {id:"g1",st:"gertrudes",a:"terbatas",b:"baron",cap:18,cam:true,camFree:7,pts:[[56.9532,24.1199],[56.9522,24.1222]]},
 {id:"g2",st:"gertrudes",a:"baron",b:"caka",cap:20,cam:false,pts:[[56.9522,24.1222],[56.9512,24.1245]]},
 {id:"g3",st:"gertrudes",a:"caka",b:"dzirnavu",cap:16,cam:false,pts:[[56.9512,24.1245],[56.9502,24.1268]]},
 {id:"t1",st:"terbatas",a:"elizabetes",b:"gertrudes",cap:22,cam:false,pts:[[56.9540,24.1140],[56.9532,24.1199]]},
 {id:"t2",st:"terbatas",a:"gertrudes",b:"brivibas",cap:20,cam:true,camFree:4,pts:[[56.9532,24.1199],[56.9525,24.1260]]},
 {id:"b1",st:"baron",a:"brivibas",b:"gertrudes",cap:30,cam:true,camFree:3,pts:[[56.9540,24.1260],[56.9522,24.1222]]},
 {id:"b2",st:"baron",a:"gertrudes",b:"elizabetes",cap:26,cam:false,pts:[[56.9522,24.1222],[56.9505,24.1190]]},
 {id:"v1",st:"brivibas",a:"baron",b:"caka",cap:28,cam:true,camFree:9,pts:[[56.9560,24.1250],[56.9575,24.1290]]}];
const lab=s=>`${DN[s.st]} between ${DN[s.a]} and ${DN[s.b]}`;
const PRIOR=[.35,.3,.3,.3,.3,.35,.45,.6,.75,.85,.88,.9,.9,.88,.88,.88,.9,.92,.9,.8,.7,.6,.5,.4];
const now=()=>Date.now();
const rep={tr:{g1:[{s:"free",t:now()-4*6e4,w:.8}],g2:[{s:"free",t:now()-7*6e4,w:.6}],t1:[{s:"occupied",t:now()-3*6e4,w:.7},{s:"occupied",t:now()-9*6e4,w:.6}]}};
let userRep=.6;try{userRep=+localStorage.getItem("ss_rep")||.6}catch(e){}
const mid=s=>[(s.pts[0][0]+s.pts[1][0])/2,(s.pts[0][1]+s.pts[1][1])/2];
const norm=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const dist=(a,b)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

// ---------- Fusion: prior + camera + decayed, trust-weighted reports ----------
function estimate(s,hour){
  const h=hour??new Date().getHours(),fresh=(rep.tr[s.id]||[]).map(r=>({...r,d:Math.exp(-(now()-r.t)/(20*6e4))})).filter(r=>r.d>.05);
  let occ=PRIOR[h];
  const adj=fresh.reduce((a,r)=>a+r.w*r.d*(r.s==="free"?-.15:.15),0);
  const repOcc=Math.min(.98,Math.max(.02,occ+adj));
  const live=hour===undefined||hour===new Date().getHours();
  if(live&&s.cam)occ=.7*(1-s.camFree/s.cap)+.3*repOcc;else if(live)occ=repOcc;
  const free=Math.round(s.cap*(1-occ));
  const conf=!live?"low (typical pattern, not live)":s.cam&&fresh.length?"high":s.cam||fresh.length>=2?"medium":"low";
  return{free,conf,n:fresh.length,occ};
}
const col=s=>{const r=estimate(s).free/s.cap;return r>.3?"var(--ok)":r>.1?"var(--mid)":"var(--bad)"};
const hexcol=s=>{const r=estimate(s).free/s.cap;return r>.3?"#1E9E5A":r>.1?"#E8A317":"#D6453D"};

// ---------- Trust engine for user reports ----------
function trust(s,status,pos){
  const g=pos?(()=>{const d=dist(pos,mid(s));return d<=150?1:d<=350?.6:.1})():.4;
  const c=s.cam?((status==="free")===(s.camFree/s.cap>.15)?1:.3):.5;
  const o=(rep.tr[s.id]||[]).filter(r=>now()-r.t<30*6e4),cons=o.length?o.filter(r=>r.s===status).length/o.length:.5;
  const score=.35*g+.25*c+.15*cons+.25*userRep;
  return{g,c,cons,score,ok:score>=.55};
}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),()=>res(null),{timeout:4000})})}

// ---------- Map ----------
const map=L.map("map").setView([56.9535,24.1190],15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);
const lines={};
function draw(){SEG.forEach(s=>{const e=estimate(s);if(!lines[s.id]){lines[s.id]=L.polyline(s.pts,{weight:9,opacity:.9}).addTo(map).on("click",()=>say(`Is there parking space available on ${lab(s)}?`))}
 lines[s.id].setStyle({color:hexcol(s)}).bindTooltip(`${lab(s)}: ~${e.free}/${s.cap} free`)})}
const lg=L.control({position:"bottomright"});lg.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML='<i style="background:#1E9E5A"></i>Many free<br><i style="background:#E8A317"></i>Few free<br><i style="background:#D6453D"></i>Almost full';return d};lg.addTo(map);
draw();

// ---------- Assistant (rule-based tools: get_availability, predict, submit_report) ----------
const log=document.getElementById("log");
function add(t,who){const d=document.createElement("div");d.className="m "+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
const fmt=(s,e)=>`${lab(s)}: about ${e.free} of ${s.cap} bays free. Source: ${s.cam?"camera + ":""}${e.n} recent report${e.n===1?"":"s"}. Confidence: ${e.conf}.`;
function parse(t){
  const ks=Object.keys(K).map(k=>({k,i:t.indexOf(K[k])})).filter(x=>x.i>=0).sort((p,q)=>p.i-q.i);
  const m=t.match(/(?:between|from)\s+(.+?)\s+(?:and|to)\s+(.+)/);
  const cross=m?[m[1],m[2]].map(p=>Object.keys(K).find(k=>p.includes(K[k]))).filter(Boolean):[];
  return{main:ks[0]&&ks[0].k,cross};
}
const blocks=m=>SEG.filter(s=>s.st===m);
const blockList=m=>blocks(m).map(s=>"• between "+DN[s.a]+" and "+DN[s.b]).join("\n");
async function reply(raw){
  const t=norm(raw),{main,cross}=parse(t);
  const seg=main&&cross.length===2?SEG.find(s=>s.st===main&&[s.a,s.b].every(c=>cross.includes(c))&&cross[0]!==cross[1]):null;
  const need=main&&!seg?(cross.length===2?`I don’t have that block of ${DN[main]} in the demo. Blocks I know:\n${blockList(main)}`:`Which block of ${DN[main]}? Please say “between … and …”. Blocks I know:\n${blockList(main)}`):null;
  const st=/free|empty|available/.test(t)?"free":/occupied|full|taken/.test(t)?"occupied":null;
  if(/report/.test(t)){
    if(!seg)return need||"Which block is it on? For example: “Report free on Ģertrūdes iela between Terbatas iela and Krišjāņa Barona iela”.";
    if(!st)return"Is the spot free or occupied?";
    const pos=await getPos(),r=trust(seg,st,pos);
    let m=`Trust check for your report (${st}) on ${lab(seg)}:\nLocation match: ${pos?r.g.toFixed(2):"0.40 (location unavailable, demo mode)"}\nCamera agreement: ${r.c.toFixed(2)}${seg.cam?"":" (no camera here)"}\nConsensus: ${r.cons.toFixed(2)}\nYour reputation: ${userRep.toFixed(2)}\nScore: ${r.score.toFixed(2)} (needs 0.55)\n`;
    if(r.ok){(rep.tr[seg.id]=rep.tr[seg.id]||[]).push({s:st,t:now(),w:r.score});userRep=Math.min(1,userRep+.03);m+="Report accepted. The map is updated."}
    else{userRep=Math.max(.1,userRep-.05);m+="Report rejected. It did not pass the trust check, so the map is unchanged."}
    try{localStorage.setItem("ss_rep",userRep)}catch(e){}
    draw();return m;
  }
  const tm=t.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(tm&&(seg||!main||cross.length!==1)){let h=+tm[1];if(tm[3]==="pm"&&h<12)h+=12;if(tm[3]==="am"&&h===12)h=0;h%=24;
    if(main&&!seg)return need;
    const list=seg?[seg]:SEG;return`Typical availability around ${String(h).padStart(2,"0")}:00 (pattern estimate, not live):\n`+list.map(x=>`${lab(x)}: about ${estimate(x,h).free} of ${x.cap} free`).join("\n")}
  if(seg){map.setView(mid(seg),17);return fmt(seg,estimate(seg))}
  if(need)return need;
  if(/where|near|best|find|park|spot|free|space/.test(t)){
    const top=[...SEG].sort((a,b)=>estimate(b).free/b.cap-estimate(a).free/a.cap).slice(0,3);
    return"Best options right now:\n"+top.map(x=>fmt(x,estimate(x))).join("\n\n")}
  return"Ask about a specific block, for example: “Is there parking space available on Ģertrūdes iela between Krišjāņa Barona iela and Aleksandra Čaka iela?”";
}
async function say(text){add(text,"me");add(await reply(text),"bot")}
document.getElementById("f").onsubmit=e=>{e.preventDefault();const i=document.getElementById("q");if(i.value.trim()){say(i.value.trim());i.value=""}};
["Is there parking space available on Ģertrūdes iela between Krišjāņa Barona iela and Aleksandra Čaka iela?","Will Ģertrūdes iela between Terbatas iela and Krišjāņa Barona iela be free at 18:00?","Report free on Terbatas iela between Elizabetes iela and Ģertrūdes iela","Where can I park right now?"].forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>say(x);document.getElementById("chips").appendChild(b)});
add("Hi, I’m the SpotSense assistant. Ask about a specific street block (for example “Ģertrūdes iela between Krišjāņa Barona iela and Aleksandra Čaka iela”), or report a free or occupied bay. All data in this demo is simulated.","bot");
</script>
</body>
</html>
